# UMA empresa por computador (cenário da apresentação no LARSID/LADICA).
# Em cada máquina:
#   EMPRESA_ID=1 PEERS="2=http://192.168.0.12:8080,3=http://192.168.0.13:8080" docker compose -f docker-compose.empresa.yml up -d --build
#   EMPRESA_ID=2 PEERS="1=http://192.168.0.11:8080,3=http://192.168.0.13:8080" docker compose -f docker-compose.empresa.yml up -d --build
#   EMPRESA_ID=3 PEERS="1=http://192.168.0.11:8080,2=http://192.168.0.12:8080" docker compose -f docker-compose.empresa.yml up -d --build
# Liberar no firewall as portas 65432/tcp (clientes) e 8080/tcp (API REST entre empresas).
services:
  servidor:
    build: { context: ., dockerfile: DockerFile/DockerFile.Servidor }
    container_name: "empresa${EMPRESA_ID:-1}"
    restart: "no"
    environment:
      EMPRESA_ID: "${EMPRESA_ID:-1}"
      PEERS: "${PEERS:-}"
      MODO_TESTE: "${MODO_TESTE:-0}"
    ports: ["65432:65432", "8080:8080"]
    volumes: ["dados:/srv/empresa"]
volumes:
  dados:
